name: Setup Rust
description: Install the pinned Rust toolchain and restore the Cargo cache

inputs:
  components:
    description: Comma-separated list of toolchain components (e.g. "rustfmt, clippy")
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: 1.98.1
        components: ${{ inputs.components }}

    - name: Cache Cargo dependencies
      uses: Swatinem/rust-cache@v2