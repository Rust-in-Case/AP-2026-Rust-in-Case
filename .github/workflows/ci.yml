name: Rust CI

on:
  push:
    paths: &rust_paths
      - '**.rs'
      - '**/Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/**'
      - '.github/actions/**'
  pull_request:
    paths: *rust_paths

jobs:
  formatting:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy-pedantic:
    name: Clippy Pedantic Lints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
        with:
          components: clippy
      - run: cargo clippy --workspace --all-targets

  cargo-check:
    name: Cargo Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
      - run: cargo check --workspace --all-targets

  cargo-test:
    name: Run Tests
    needs: cargo-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
      - run: cargo test --workspace --all-targets --verbose