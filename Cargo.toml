[workspace]
members = [
  "crates/*"
]
resolver = "3"

[workspace.package]
version = "0.1.0"
authors = [
  "Rareș Postelnicu <rares.postelnicu@studenti.unitn.it>",
  "Thomas Mattarei <thomas.mattarei@studenti.unitn.it>",
  "Mattia Colosio <mattia.colosio@studenti.unitn.it>",
  "Nikita Rotaru <nikita.rotaru@studenti.unitn.it>"
]
description = "Rust in Case's AP Project"
rust-version = "1.98.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = "deny"
missing_panics_doc = "deny"

[workspace.dependencies]
contractors = {
  git = "https://github.com/SharedCode-UniTn-AP-2026/Common_Code-AP_2026.git", 
  package = "ap-2026-common-code",
  rev = "459091e"
}
rand = "0.10.4"
rand_chacha = "0.10.0"
thiserror = "2.0.21"